<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{ .Title }}</title>
  <meta name="description" content="{{ .Description }}">
  <link rel="icon" href="{{ "favicon.ico" | relURL }}">
  <style>
    *,*::before,*::after{box-sizing:border-box;margin:0;padding:0}

    :root {
      --bg: #0f0f0f;
      --surface: #1a1a1a;
      --surface-hover: #242424;
      --text: #f5f5f5;
      --text-muted: #a0a0a0;
      --accent: #6366f1;
      --accent-glow: rgba(99,102,241,0.15);
      --radius: 16px;
    }

    html {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100dvh;
    }

    body {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100dvh;
      padding: 2rem 1.25rem;
      background:
        radial-gradient(ellipse 80% 60% at 50% -10%, var(--accent-glow), transparent),
        var(--bg);
    }

    .card {
      width: 100%;
      max-width: 420px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 2rem;
    }

    /* Avatar */
    .avatar {
      width: 96px;
      height: 96px;
      border-radius: 50%;
      background: linear-gradient(135deg, var(--accent), #8b5cf6);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 2.25rem;
      font-weight: 700;
      color: #fff;
      box-shadow: 0 0 0 4px var(--bg), 0 0 0 6px rgba(99,102,241,0.3);
    }

    .header {
      text-align: center;
    }

    .header h1 {
      font-size: 1.5rem;
      font-weight: 700;
      margin-bottom: 0.35rem;
      letter-spacing: -0.01em;
    }

    .header p {
      color: var(--text-muted);
      font-size: 0.95rem;
      line-height: 1.5;
    }

    /* Links */
    .links {
      width: 100%;
      display: flex;
      flex-direction: column;
      gap: 0.75rem;
    }

    .link-item {
      display: flex;
      align-items: center;
      gap: 1rem;
      padding: 1rem 1.25rem;
      background: var(--surface);
      border: 1px solid rgba(255,255,255,0.06);
      border-radius: var(--radius);
      text-decoration: none;
      color: var(--text);
      transition: all 0.2s ease;
      position: relative;
      overflow: hidden;
    }

    .link-item:hover {
      background: var(--surface-hover);
      border-color: rgba(99,102,241,0.3);
      transform: translateY(-2px);
      box-shadow: 0 8px 24px rgba(0,0,0,0.3);
    }

    .link-item:active {
      transform: translateY(0);
    }

    .link-icon {
      width: 40px;
      height: 40px;
      border-radius: 10px;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
    }

    .link-icon svg {
      width: 22px;
      height: 22px;
      fill: currentColor;
    }

    .link-text {
      flex: 1;
    }

    .link-text .label {
      font-weight: 600;
      font-size: 0.95rem;
    }

    .link-text .desc {
      font-size: 0.8rem;
      color: var(--text-muted);
      margin-top: 0.15rem;
    }

    .link-arrow {
      color: var(--text-muted);
      transition: transform 0.2s ease;
    }

    .link-item:hover .link-arrow {
      transform: translateX(3px);
      color: var(--accent);
    }

    /* Icon colors */
    .icon-blog { background: rgba(99,102,241,0.15); color: #6366f1; }
    .icon-medium { background: rgba(255,255,255,0.08); color: #fff; }
    .icon-linkedin { background: rgba(10,102,194,0.15); color: #0a66c2; }
    .icon-aca { background: rgba(239,68,68,0.15); color: #ef4444; }

    /* Footer */
    .footer {
      margin-top: 1.5rem;
      text-align: center;
      color: var(--text-muted);
      font-size: 0.8rem;
    }

    .footer a {
      color: var(--text-muted);
      text-decoration: none;
      transition: color 0.2s;
    }

    .footer a:hover {
      color: var(--accent);
    }

    /* Subtle animation on load */
    @keyframes fadeUp {
      from { opacity: 0; transform: translateY(12px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .card > * {
      animation: fadeUp 0.5s ease both;
    }
    .card > :nth-child(1) { animation-delay: 0s; }
    .card > :nth-child(2) { animation-delay: 0.08s; }
    .card > :nth-child(3) { animation-delay: 0.16s; }
    .card > :nth-child(4) { animation-delay: 0.24s; }
  </style>
</head>
<body>

        <div class="link-icon icon-aca">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M22 10v6M2 10l10-5 10 5-10 5z"/><path d="M6 12v5c0 1.66 2.69 3 6 3s6-1.34 6-3v-5"/></svg>

    <div class="footer">
      <a href="https://gor-grigoryan.com">&copy; Gor Grigoryan</a>
    </div>
  </div>
</body>
</html>
